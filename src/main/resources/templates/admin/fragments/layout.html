<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!-- ── HEAD ─────────────────────────────────────────────────────────────── -->
<th:block th:fragment="head(title)">
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title th:text="${title} + ' — SurveyXchange Admin'">SurveyXchange Admin</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0/dist/css/tabler.min.css"/>
</th:block>

<!-- ── SIDEBAR ───────────────────────────────────────────────────────────── -->
<th:block th:fragment="sidebar(activePage)">
  <aside class="navbar navbar-vertical navbar-expand-lg" data-bs-theme="dark">
    <div class="container-fluid">
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#sidebar-menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <h1 class="navbar-brand navbar-brand-autodark">
        <a href="/admin" class="text-white text-decoration-none">SurveyXchange Admin</a>
      </h1>
      <div class="collapse navbar-collapse" id="sidebar-menu">
        <ul class="navbar-nav pt-lg-3">

          <li class="nav-item" th:classappend="${activePage == 'dashboard'} ? ' active'">
            <a class="nav-link" href="/admin">
              <span class="nav-link-icon d-md-none d-lg-inline-block">
                <svg xmlns="http://www.w3.org/2000/svg" class="icon" width="24" height="24" viewBox="0 0 24 24"
                     stroke-width="2" stroke="currentColor" fill="none"><path stroke="none" d="M0 0h24v24H0z" fill="none"/>
                  <path d="M5 12l-2 0l9 -9l9 9l-2 0"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-7"/>
                  <path d="M9 21v-6a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2v6"/></svg>
              </span>
              <span class="nav-link-title">Dashboard</span>
            </a>
          </li>

          <li class="nav-item" th:classappend="${activePage == 'users'} ? ' active'">
            <a class="nav-link" href="/admin/users">
              <span class="nav-link-icon d-md-none d-lg-inline-block">
                <svg xmlns="http://www.w3.org/2000/svg" class="icon" width="24" height="24" viewBox="0 0 24 24"
                     stroke-width="2" stroke="currentColor" fill="none"><path stroke="none" d="M0 0h24v24H0z" fill="none"/>
                  <circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2"/>
                  <path d="M16 3.13a4 4 0 0 1 0 7.75"/><path d="M21 21v-2a4 4 0 0 0 -3 -3.85"/></svg>
              </span>
              <span class="nav-link-title">Users</span>
            </a>
          </li>

          <li class="nav-item" th:classappend="${activePage == 'surveys'} ? ' active'">
            <a class="nav-link" href="/admin/surveys">
              <span class="nav-link-icon d-md-none d-lg-inline-block">
                <svg xmlns="http://www.w3.org/2000/svg" class="icon" width="24" height="24" viewBox="0 0 24 24"
                     stroke-width="2" stroke="currentColor" fill="none"><path stroke="none" d="M0 0h24v24H0z" fill="none"/>
                  <path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M17 21h-10a2 2 0 0 1 -2 -2v-14a2 2 0 0 1 2 -2h7l5 5v11a2 2 0 0 1 -2 2z"/>
                  <path d="M9 15l2 2l4 -4"/></svg>
              </span>
              <span class="nav-link-title">Surveys</span>
            </a>
          </li>

          <li class="nav-item" th:classappend="${activePage == 'transactions'} ? ' active'">
            <a class="nav-link" href="/admin/transactions">
              <span class="nav-link-icon d-md-none d-lg-inline-block">
                <svg xmlns="http://www.w3.org/2000/svg" class="icon" width="24" height="24" viewBox="0 0 24 24"
                     stroke-width="2" stroke="currentColor" fill="none"><path stroke="none" d="M0 0h24v24H0z" fill="none"/>
                  <path d="M17 8l4 4l-4 4"/><path d="M3 12h18"/><path d="M7 16l-4 -4l4 -4"/></svg>
              </span>
              <span class="nav-link-title">Transactions</span>
            </a>
          </li>

        </ul>

        <div class="mt-auto pb-3">
          <form method="post" action="/admin/logout">
            <button type="submit" class="btn btn-outline-danger btn-sm w-100">
              <svg xmlns="http://www.w3.org/2000/svg" class="icon me-1" width="16" height="16" viewBox="0 0 24 24"
                   stroke-width="2" stroke="currentColor" fill="none"><path stroke="none" d="M0 0h24v24H0z" fill="none"/>
                <path d="M14 8v-2a2 2 0 0 0 -2 -2h-7a2 2 0 0 0 -2 2v12a2 2 0 0 0 2 2h7a2 2 0 0 0 2 -2v-2"/>
                <path d="M9 12h12l-3 -3"/><path d="M18 15l3 -3"/></svg>
              Sign out
            </button>
          </form>
        </div>

      </div>
    </div>
  </aside>
</th:block>

<!-- ── SCRIPTS ───────────────────────────────────────────────────────────── -->
<th:block th:fragment="scripts">
  <script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0/dist/js/tabler.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</th:block>

</html>
