<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta http-equiv="X-UA-Compatible" content="ie=edge"/>
  <title>Admin Login — SurveyExchange</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0/dist/css/tabler.min.css"/>
</head>
<body class="antialiased">
<div class="page page-center">
  <div class="container container-tight py-4">

    <div class="text-center mb-4">
      <span class="h2 fw-bold">SurveyExchange</span>
      <span class="badge bg-blue-lt ms-2">Admin</span>
    </div>

    <div class="card card-md">
      <div class="card-body">
        <h2 class="h2 text-center mb-4">Sign in to admin panel</h2>

        <div th:if="${param.error}" class="alert alert-danger" role="alert">
          Invalid username or password.
        </div>
        <div th:if="${param.logout}" class="alert alert-info" role="alert">
          You have been signed out.
        </div>

        <form method="post" action="/admin/login" autocomplete="off">
          <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" name="username" class="form-control" placeholder="Enter username" autofocus/>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" placeholder="Enter password"/>
          </div>
          <div class="form-footer">
            <button type="submit" class="btn btn-primary w-100">Sign in</button>
          </div>
        </form>
      </div>
    </div>

  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0/dist/js/tabler.min.js"></script>
</body>
</html>
